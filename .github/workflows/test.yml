name: テスト

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: ユニットテスト
        run: python -m unittest discover -s tests
        env:
          PYTHONPATH: src
      - name: 投稿キューの検証
        run: python -m threads_bot validate
        env:
          PYTHONPATH: src

  database:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - name: 権限（RLS）のテスト
        run: |
          psql -v ON_ERROR_STOP=1 -q -f supabase/tests/stub_supabase.sql
          psql -v ON_ERROR_STOP=1 -q -f supabase/migrations/0001_init.sql
          psql -v ON_ERROR_STOP=1 -q -f supabase/tests/rls_test.sql
      - name: 初期データが読み込めるか
        run: psql -v ON_ERROR_STOP=1 -q -f supabase/seed/shops_public.sql -f supabase/seed/shops_public.sql

  functions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: 型チェック
        working-directory: supabase/functions
        run: deno check */index.ts
      - name: Stripe 通知のテスト
        working-directory: supabase/functions
        env:
          SUPABASE_URL: http://localhost
          SUPABASE_SERVICE_ROLE_KEY: dummy
        run: deno test --allow-env --allow-net stripe-webhook/test.ts
